name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - qa
      - main

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its cache resolver can
      # find the store. Version comes from the root package.json
      # "packageManager" field — keep them in lockstep.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm turbo run lint

      # Runs every suite — apps/web plus the @dispatch/* packages — and
      # enforces the coverage thresholds in apps/web/vitest.config.ts. One pass
      # instead of two: adding a plain `test` step would re-run the same ~2000
      # tests for no extra signal. Any package that gains a test:coverage
      # script is picked up here automatically.
      - name: Run tests with coverage
        run: pnpm turbo run test:coverage -- --run

      - name: Build
        run: pnpm turbo run build --filter=web
        env:
          # Use example values for build validation
          VITE_COGNITO_USER_POOL_ID: us-east-1_EXAMPLE
          VITE_COGNITO_CLIENT_ID: example_client_id
          VITE_COGNITO_DOMAIN: example.auth.us-east-1.amazoncognito.com
          VITE_API_BASE_URL: https://api.example.com
          VITE_ENV: development

      - name: Check build size
        run: |
          BUILD_SIZE=$(du -sh apps/web/dist/ | cut -f1)
          echo "📦 Build size: $BUILD_SIZE"

          # Warn if build is larger than 5MB
          BUILD_SIZE_KB=$(du -sk apps/web/dist/ | cut -f1)
          if [ $BUILD_SIZE_KB -gt 5120 ]; then
            echo "⚠️ Warning: Build size exceeds 5MB"
          else
            echo "✅ Build size is acceptable"
          fi

      - name: Summary
        run: |
          echo "✅ All checks passed!"
          echo "- Lint: Passed"
          echo "- Tests: Passed"
          echo "- Coverage: ≥80% lines/branches/statements, ≥75% functions"
          echo "- Build: Success"
