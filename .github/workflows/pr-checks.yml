name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - qa
      - main

env:
  NODE_VERSION: '24'

jobs:
  test:
    # NOTE: this string is the status-check context that branch protection on
    # dev/qa/main requires by exact name. Renaming it here without updating the
    # required check in branch protection leaves PRs blocked on a context that
    # will never report again.
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its cache resolver can
      # find the store. Version comes from the root package.json
      # "packageManager" field — keep them in lockstep.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guards two invariants for deps that must stay in lockstep (typescript
      # and @types/node):
      #   1. every package resolves the SAME version — pnpm keys peer-dependent
      #      packages by their peers' versions, so a split TypeScript version
      #      forks anything peering on it. react-i18next did exactly that,
      #      producing two React contexts and 79 failing tests that all looked
      #      like unrelated i18n bugs (#380).
      #   2. every package that needs one DECLARES it — the workspace root's
      #      node_modules makes undeclared deps resolve anyway, so a phantom
      #      dependency works locally and only breaks once the package is built
      #      in isolation or the root's version moves.
      # Runs right after install so it fails in seconds, before the ~2000-test
      # suite. See check-dep-drift.mjs.
      - name: Check dependency drift
        run: pnpm check:deps

      - name: Run linter
        run: pnpm turbo run lint

      # Runs every suite — apps/web plus the @dispatch/* packages — and
      # enforces the coverage thresholds in apps/web/vitest.config.ts. One pass
      # instead of two: adding a plain `test` step would re-run the same ~2000
      # tests for no extra signal. Any package that gains a test:coverage
      # script is picked up here automatically.
      #
      # No extra flags are passed. This used to append `-- --run`, a
      # vitest-only flag, which every package received — so when apps/mobile
      # moved to jest, jest read `--run` as a test-path pattern, matched
      # nothing and failed. Each package's own script is self-contained
      # instead, so this step stays runner-agnostic.
      - name: Run tests with coverage
        run: pnpm turbo run test:coverage

      - name: Build
        run: pnpm turbo run build --filter=web
        env:
          # Use example values for build validation
          VITE_COGNITO_USER_POOL_ID: us-east-1_EXAMPLE
          VITE_COGNITO_CLIENT_ID: example_client_id
          VITE_COGNITO_DOMAIN: example.auth.us-east-1.amazoncognito.com
          VITE_API_BASE_URL: https://api.example.com
          VITE_ENV: development

      - name: Check build size
        run: |
          BUILD_SIZE=$(du -sh apps/web/dist/ | cut -f1)
          echo "📦 Build size: $BUILD_SIZE"

          # Warn if build is larger than 5MB
          BUILD_SIZE_KB=$(du -sk apps/web/dist/ | cut -f1)
          if [ $BUILD_SIZE_KB -gt 5120 ]; then
            echo "⚠️ Warning: Build size exceeds 5MB"
          else
            echo "✅ Build size is acceptable"
          fi

      - name: Summary
        run: |
          echo "✅ All checks passed!"
          echo "- Lint: Passed"
          echo "- Dependency drift: Passed"
          echo "- Tests: Passed"
          echo "- Coverage: ≥80% lines/branches/statements, ≥75% functions"
          echo "- Build: Success"
