name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - qa
      - main

env:
  NODE_VERSION: '24'
  # What `--affected` diffs against. Turbo defaults this to `main`, which does
  # not exist in this repo — `dev` is the default branch — and an unresolvable
  # base makes turbo fall back to "everything changed", silently turning the
  # flag into a no-op.
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  test:
    # NOTE: this string is the status-check context that branch protection on
    # dev/qa/main requires by exact name. Renaming it here without updating the
    # required check in branch protection leaves PRs blocked on a context that
    # will never report again.
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Turbo diffs this PR against its base to work out which packages it
          # can affect; the default depth-1 clone has no base commit to diff
          # against, and turbo then treats everything as changed.
          fetch-depth: 0

      # pnpm must be installed before setup-node so its cache resolver can
      # find the store. Version comes from the root package.json
      # "packageManager" field — keep them in lockstep.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guards two invariants for deps that must stay in lockstep (typescript
      # and @types/node):
      #   1. every package resolves the SAME version — pnpm keys peer-dependent
      #      packages by their peers' versions, so a split TypeScript version
      #      forks anything peering on it. react-i18next did exactly that,
      #      producing two React contexts and 79 failing tests that all looked
      #      like unrelated i18n bugs (#380).
      #   2. every package that needs one DECLARES it — the workspace root's
      #      node_modules makes undeclared deps resolve anyway, so a phantom
      #      dependency works locally and only breaks once the package is built
      #      in isolation or the root's version moves.
      # Runs right after install so it fails in seconds, before the ~2000-test
      # suite. See check-dep-drift.mjs.
      - name: Check dependency drift
        run: pnpm check:deps

      # Scope the rest of the run to what this PR can actually affect. Turbo
      # walks the dependency graph, so a change under packages/ still tests web
      # AND mobile — but a mobile-only or docs-only PR stops paying for web's
      # ~2000-test suite, which is ~6m44s of a typical 8m38s run.
      #
      # Anything that can change how every package resolves or builds is
      # excluded from scoping and forces a full run. Turbo's
      # `globalDependencies` does NOT cover this — it feeds cache hashing, not
      # `--affected`'s package selection, so without this guard a lockfile bump
      # would select no packages and quietly test nothing.
      #
      # Both failure modes here fall back to running everything, never less.
      - name: Determine scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Base commit unavailable — running everything."
            echo "scope=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "$BASE_SHA...HEAD"); then
            echo "Could not diff against the base — running everything."
            echo "scope=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          if echo "$CHANGED" | grep -qE '^(pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|turbo\.json|\.github/workflows/)'; then
            echo "Workspace-wide change — running everything."
            echo "scope=" >> "$GITHUB_OUTPUT"
          else
            echo "Scoping to packages affected since $BASE_SHA."
            echo "scope=--affected" >> "$GITHUB_OUTPUT"
          fi

      - name: Run linter
        run: pnpm turbo run lint ${{ steps.scope.outputs.scope }}

      # apps/web gets type-checked for free — its build script is `tsc -b &&
      # vite build`, run below. apps/mobile has no build script (it ships via
      # EAS, not this pipeline), so without this step its types went
      # completely unchecked: Babel strips types at transform time, so Jest
      # passing says nothing about them, and ESLint's type-aware rules don't
      # cover every type error tsc does. Runs for whichever packages declare a
      # `typecheck` script — only apps/mobile today — same convention as the
      # test:coverage step below.
      - name: Run typecheck
        run: pnpm turbo run typecheck ${{ steps.scope.outputs.scope }}

      # Runs every suite — apps/web plus the @dispatch/* packages — and
      # enforces the coverage thresholds in apps/web/vitest.config.ts. One pass
      # instead of two: adding a plain `test` step would re-run the same ~2000
      # tests for no extra signal. Any package that gains a test:coverage
      # script is picked up here automatically.
      #
      # No extra flags are passed. This used to append `-- --run`, a
      # vitest-only flag, which every package received — so when apps/mobile
      # moved to jest, jest read `--run` as a test-path pattern, matched
      # nothing and failed. Each package's own script is self-contained
      # instead, so this step stays runner-agnostic.
      - name: Run tests with coverage
        run: pnpm turbo run test:coverage ${{ steps.scope.outputs.scope }}

      - name: Build
        run: pnpm turbo run build --filter=web ${{ steps.scope.outputs.scope }}
        env:
          # Use example values for build validation
          VITE_COGNITO_USER_POOL_ID: us-east-1_EXAMPLE
          VITE_COGNITO_CLIENT_ID: example_client_id
          VITE_COGNITO_DOMAIN: example.auth.us-east-1.amazoncognito.com
          VITE_API_BASE_URL: https://api.example.com
          VITE_ENV: development

      # dist/ only exists when the step above actually built web, which a
      # mobile- or docs-only PR skips. Absence is a pass, not a failure.
      - name: Check build size
        run: |
          if [ ! -d apps/web/dist ]; then
            echo "⏭️  Web was not rebuilt for this PR — nothing to measure."
            exit 0
          fi

          BUILD_SIZE=$(du -sh apps/web/dist/ | cut -f1)
          echo "📦 Build size: $BUILD_SIZE"

          # Warn if build is larger than 5MB
          BUILD_SIZE_KB=$(du -sk apps/web/dist/ | cut -f1)
          if [ $BUILD_SIZE_KB -gt 5120 ]; then
            echo "⚠️ Warning: Build size exceeds 5MB"
          else
            echo "✅ Build size is acceptable"
          fi

      - name: Summary
        run: |
          echo "✅ All checks passed!"
          if [ -n "${{ steps.scope.outputs.scope }}" ]; then
            echo "Scope: packages affected by this PR (and everything depending on them)."
          else
            echo "Scope: every package — this PR touches the lockfile, a root manifest, or CI itself."
          fi
          echo "- Lint, typecheck, tests + coverage, build: passed for everything in scope"
          echo "- Coverage: ≥80% lines/branches/statements, ≥75% functions"
