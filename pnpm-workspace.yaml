packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for dependencies that must stay in lockstep across
# every workspace package. Packages reference these as "catalog:" instead of
# repeating a range, so they cannot drift apart.
#
# typescript is catalogued because a split version silently forks any package
# that declares it as a peer — react-i18next did exactly that, producing two
# React contexts and 79 failing tests (see #380). check-dep-drift.mjs enforces
# the invariant in CI; the catalog is what makes it hard to break in the first
# place.
catalog:
  typescript: 6.0.3
  # apps/web was already on 24.x; packages/api had been left on 20.x, whose
  # Node line reached end-of-life 2026-04-30. Aligned up to 24.x so the same
  # shared sources are not typechecked against two different Node type
  # universes (web compiles packages/api/src directly).
  '@types/node': 24.13.3

# pnpm 10+ does not run dependency install scripts unless they are allowlisted
# here, and treats an un-declared one as an install error rather than a warning.
#
# Note this key is `allowBuilds` (a map), not pnpm 10's `onlyBuiltDependencies`
# (a list), and it lives here rather than in package.json: pnpm 11 no longer
# reads the "pnpm" field from package.json. See https://pnpm.io/settings.
#
#   esbuild          — downloads its platform binary; vite and vitest fail
#                      outright without it.
#   @parcel/watcher  — jest-haste-map's file watcher (watch mode).
#   unrs-resolver    — jest-resolve's native module resolver.
#
# The two Jest entries are accelerators, not requirements: Jest falls back to
# slower pure-JS paths if their builds fail, so they are safe to flip to false
# if a platform ever cannot compile them.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
